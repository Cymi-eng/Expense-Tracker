<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> Expense Tracker</h1>

    <div class="form-box">
        <input type="text" id="description" placeholder="Description (e.g. Lunch)">
        <input type="number" id="amount" placeholder="Amount (KES)">
        <select id="category">
            <option value="">-- Select Category --</option>
            <option value="Food"> Food</option>
            <option value="Transport"> Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Entertainment"> Entertainment</option>
            <option value="Other"> Other</option>
        </select>
        <button id="addBtn">+ Add Expense</button>
        <p id="errorMsg"></p>
    </div>

    <div class="summary-box">
        <h3>Total: KES <span id="total">0.00</span></h3>
        <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Health"> Health</option>
            <option value="Entertainment"> Entertainment</option>
            <option value="Other"> Other</option>
        </select>
    </div>

    <ul id="expenseList"></ul>

    <script src="expenseTracker.js"></script>
    <script src="script.js"></script>

</body>
</html>
